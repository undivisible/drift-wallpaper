# Minimal workspace for the subset vendored in drift-wallpaper (GPUI + view macros + runtime).
# Upstream Crepuscularity also ships web, CLI, examples, etc.; those paths are omitted here.

[workspace]
resolver = "2"
members = [
    "crates/crepuscularity-core",
    "crates/crepuscularity-gpui",
    "crates/crepuscularity_macros",
    "crates/crepuscularity-runtime",
]

[workspace.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[patch.crates-io]
gpui = { path = "vendor/gpui" }
