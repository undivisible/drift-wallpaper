name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev

      - name: Rust fmt check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev

      - name: Test (workspace, all targets)
        run: cargo test --workspace --all-targets --locked

      - name: Build release binary
        run: cargo build --locked --release -p drift-app

  build-release:
    name: Build Release (${{ matrix.os }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform_name: macos-aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_name: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev

      - name: Build release binary
        run: |
          cargo build --locked --release -p drift-app --target ${{ matrix.target }}

      - name: Package artifact
        id: package
        shell: bash
        run: |
          # Determine the built binary path
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN="target/x86_64-pc-windows-msvc/release/drift-wallpaper.exe"
            OUT_NAME="drift-wallpaper-${{ matrix.platform_name }}.exe"
          else
            BIN="target/${{ matrix.target }}/release/drift-wallpaper"
            OUT_NAME="drift-wallpaper-${{ matrix.platform_name }}"
          fi

          # Copy to output name
          cp "$BIN" "$OUT_NAME"

          # Create archive
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -NoProfile -Command "Compress-Archive -LiteralPath '${OUT_NAME}' -DestinationPath '${OUT_NAME}.zip' -Force"
            ASSET_PATH="${OUT_NAME}.zip"
          else
            tar -czf "${OUT_NAME}.tar.gz" "$OUT_NAME"
            ASSET_PATH="${OUT_NAME}.tar.gz"
          fi

          echo "ASSET_PATH=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$(basename $ASSET_PATH)" >> $GITHUB_OUTPUT

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-wallpaper-${{ matrix.platform_name }}
          path: ${{ steps.package.outputs.ASSET_PATH }}

  create-release:
    name: Create Release
    needs: [build-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets and checksums
        run: |
          mkdir -p release-assets
          for dir in artifacts/*/; do
            [ -d "$dir" ] || continue
            filename="$(ls -1 "$dir" | head -1)"
            cp "$dir/$filename" "release-assets/${filename}"
            # Also copy the checksum
            (cd "release-assets" && sha256sum "${filename}" > "${filename}.sha256")
          done
          echo "Prepared assets:"
          ls -l release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}