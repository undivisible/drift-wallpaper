name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev

      - name: Rust fmt check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev

      - name: Test (workspace, all targets)
        run: cargo test --workspace --all-targets --locked

      - name: Build release binary
        run: cargo build --locked --release -p drift-app

      - name: Verify cargo install
        run: cargo install --path crates/drift-app --locked --force

  build-release:
    name: Build Release (${{ matrix.os }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev

      - name: Build release binary
        run: cargo build --locked --release -p drift-app

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          OS="${{ runner.os }}"
          MATRIX_OS="${{ matrix.os }}"
          case "$OS" in
            "macOS") ARTIFACT_NAME="drift-wallpaper-${MATRIX_OS}" ;;
            "Linux") ARTIFACT_NAME="drift-wallpaper-linux" ;;
            "Windows") ARTIFACT_NAME="drift-wallpaper-windows.exe" ;;
          esac
          echo "NAME=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          if [ "$OS" = "Windows" ]; then
            echo "EXT=.exe" >> $GITHUB_OUTPUT
          else
            echo "EXT=" >> $GITHUB_OUTPUT
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.NAME }}
          path: target/release/drift-wallpaper${{ steps.artifact.outputs.EXT }}

  create-release:
    name: Create Release
    needs: [build-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksum file
        run: |
          cd artifacts
          for dir in */; do
            platform="${dir%/}"
            cd "$platform"
            if [ -f drift-wallpaper.exe ]; then
              sha256sum drift-wallpaper.exe > drift-wallpaper.exe.sha256
            else
              sha256sum drift-wallpaper* | grep -v '.sha256' > drift-wallpaper.sha256
            fi
            cd ..
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/drift-wallpaper-macos-14/drift-wallpaper
            artifacts/drift-wallpaper-macos-14/drift-wallpaper.sha256
            artifacts/drift-wallpaper-macos-15/drift-wallpaper
            artifacts/drift-wallpaper-macos-15/drift-wallpaper.sha256
            artifacts/drift-wallpaper-linux/drift-wallpaper
            artifacts/drift-wallpaper-linux/drift-wallpaper.sha256
            artifacts/drift-wallpaper-windows.exe/drift-wallpaper.exe
            artifacts/drift-wallpaper-windows.exe/drift-wallpaper.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
