name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Syntax check + test drift-core on Linux (platform-independent code).
  # ──────────────────────────────────────────────────────────────────────────
  check-linux:
    name: Check & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # wgpu on Linux needs system-level Vulkan / GL headers for linking.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev

      - name: Rust fmt check
        run: cargo fmt --check

      - name: Clippy (drift-core)
        run: cargo clippy -p drift-core -- -D warnings

      - name: Clippy (drift-app, Linux stubs)
        run: cargo clippy -p drift-app -- -D warnings

      - name: Test (drift-core)
        run: cargo test -p drift-core

      - name: Test (drift-app, Linux stubs)
        run: cargo test -p drift-app

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Full build + test on macOS (native target, Metal backend).
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Clippy (all)
        run: cargo clippy --workspace -- -D warnings

      - name: Test (all)
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p drift-app

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-wallpaper-macos-aarch64
          path: target/release/drift-wallpaper
