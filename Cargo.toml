[workspace]
members = [
    "crates/drift-core",
    "crates/drift-app",
]
resolver = "2"

[workspace.package]
version = "0.1.43"
edition = "2021"
authors = ["Max Carter <undivisible@vk.com>"]
license = "MPL-2.0"
repository = "https://github.com/undivisible/drift-wallpaper"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[workspace.dependencies]
log = "0.4"
env_logger = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1.4", features = ["derive"] }
glam = "0.32"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = { version = "29.0", features = ["wgsl"] }
winit = { version = "0.30", features = ["rwh_06"] }
pollster = "0.4"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
crepuscularity-runtime = "0.3.0"
approx = "0.5.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
rand = { version = "0.10", features = ["thread_rng"] }
rand_pcg = "0.10"
rand_seeder = "0.5"
rustc-hash = "2.1"
thiserror = "2"
