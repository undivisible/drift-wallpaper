[workspace]
members = ["crates/drift-core", "crates/drift-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Max Carter <undivisible@vk.com>"]
license = "MPL-2.0"
repository = "https://github.com/undivisible/drift-wallpaper"

[workspace.dependencies]
# Shared dependencies pinned at workspace level
log = "0.4"
env_logger = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = { version = "22", features = ["wgsl"] }
winit = { version = "0.30", features = ["rwh_06"] }
pollster = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
unicode-segmentation = "1"
# Used by vendored `crepuscularity/crates/crepuscularity_macros` (path dependency).
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[patch.crates-io]
gpui = { path = "crepuscularity/vendor/gpui" }
