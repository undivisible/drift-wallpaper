[package]
name = "drift-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "macOS live-wallpaper app powered by the Drift fluid simulation"

[[bin]]
name = "drift-wallpaper"
path = "src/main.rs"

[dependencies]
drift-core = { path = "../drift-core" }
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
image.workspace = true
gpui.workspace = true
unicode-segmentation.workspace = true
crepuscularity-runtime.workspace = true

# macOS-only dependencies: Objective-C runtime + AppKit
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "objc2-core-foundation",
    "NSString",
    "NSURL",
    "NSDictionary",
    "NSArray",
    "NSError",
    "NSDate",
    "NSRunLoop",
    "NSDistributedNotificationCenter",
    "NSProcessInfo",
    "NSFileManager",
    "NSUserDefaults",
    "NSBundle",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSScreen",
    "NSWorkspace",
    "NSStatusBar",
    "NSStatusItem",
    "NSMenu",
    "NSMenuItem",
    "NSButton",
    "NSView",
    "NSPanel",
    "NSResponder",
    "NSOpenPanel",
    "NSAlert",
    "NSColorPanel",
    "NSColor",
    "NSColorSpace",
] }

# Linux-only dependencies: MPRIS D-Bus for media player querying
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", features = ["async-fs"] }
x11 = { version = "2", features = ["xlib", "xrandr"] }

# Windows-only dependencies: Media Session API for now playing
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Media_Control",
    "Win32",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
